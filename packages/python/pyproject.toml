[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqltoviz"
version = "0.1.0a1"
description = "Local SQL result visualization: deterministic preview"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/jmmana/sqltoviz"

[tool.setuptools.packages.find]
include = ["sqltoviz*"]
