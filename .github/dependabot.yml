version: 2
# research/kaggle is intentionally NOT listed: its dependencies are pinned for
# byte-reproducible ONNX export and reproduced metrics (E01); bump them by hand
# and re-run the pipeline.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: pip
    directory: /packages/python
    target-branch: development
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /packages/npm
    target-branch: development
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /docs
    target-branch: development
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /packages/nuget/SqlToViz.Tests
    target-branch: development
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
