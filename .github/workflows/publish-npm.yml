name: Publish npm alpha
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish production npm package'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
      - if: inputs.publish
        run: npm publish --access public --tag alpha --provenance
