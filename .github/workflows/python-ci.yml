name: Python SDK CI
on:
  pull_request:
    paths: ['packages/python/**', '.github/workflows/python-ci.yml']
  push:
    branches: [development, main]
    paths: ['packages/python/**', '.github/workflows/python-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m unittest discover -s tests
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python -m venv /tmp/sqltoviz-smoke
          /tmp/sqltoviz-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/sqltoviz-smoke/bin/python -c "from sqltoviz import recommend; assert recommend('SELECT 1',[{'x':1}])['chartType']=='kpi'"
