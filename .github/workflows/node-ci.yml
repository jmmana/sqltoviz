name: Node SDK CI
on:
  pull_request:
    paths: ['packages/npm/**', 'parity/**', 'spec/**', '.github/workflows/node-ci.yml']
  push:
    branches: [development, main]
    paths: ['packages/npm/**', 'parity/**', 'spec/**', '.github/workflows/node-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ../../spec/generate_bindings.py --check
      - run: npm install --ignore-scripts
      - run: npm test
      - run: |
          archive=$(npm pack --silent)
          mkdir -p /tmp/sqltoviz-smoke
          cp "$archive" /tmp/sqltoviz-smoke/
          cd /tmp/sqltoviz-smoke
          npm init -y
          npm install "./$archive"
          node --input-type=module -e "import {recommend} from 'sqltoviz'; if(recommend('SELECT 1',[{x:1}]).chartType!=='kpi')process.exit(1)"
          node -e "if(require('sqltoviz').recommend('SELECT 1',[{x:1}]).chartType!=='kpi')process.exit(1)"
          npm install onnxruntime-node@1.31.1 onnxruntime-web@1.31.1
          node --input-type=module -e "import {loadDefaultEngine} from 'sqltoviz/node'; const r=await (await loadDefaultEngine()).recommend('SELECT SUM(x) AS s FROM t',['s'],[[3]]); if(r.final_class!=='kpi'||r.model_status!=='experimental')process.exit(1)"
