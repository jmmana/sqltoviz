name: Node SDK CI
on:
  pull_request:
    paths: ['packages/npm/**', '.github/workflows/node-ci.yml']
  push:
    branches: [development, main]
    paths: ['packages/npm/**', '.github/workflows/node-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts
      - run: npm test
      - run: |
          archive=$(npm pack --silent)
          mkdir -p /tmp/sqltoviz-smoke
          cp "$archive" /tmp/sqltoviz-smoke/
          cd /tmp/sqltoviz-smoke
          npm init -y
          npm install "./$archive"
          node --input-type=module -e "import {recommend} from '@sqltoviz/core'; if(recommend('SELECT 1',[{x:1}]).chartType!=='kpi')process.exit(1)"
          node -e "if(require('@sqltoviz/core').recommend('SELECT 1',[{x:1}]).chartType!=='kpi')process.exit(1)"
