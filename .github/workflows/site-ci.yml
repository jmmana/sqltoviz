name: Playground CI
on:
  pull_request:
    paths: ['site/**','packages/npm/**','model/**','.github/workflows/site-ci.yml','.github/workflows/pages.yml']
  push:
    branches: [development,main]
    paths: ['site/**','packages/npm/**','model/**','.github/workflows/site-ci.yml','.github/workflows/pages.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd packages/npm && npm install --ignore-scripts && npm run build
      - run: node site/build-engine.mjs
      - run: node --test site/*.test.mjs
      - name: Real-browser test of the experimental WASM model
        run: |
          npm install --no-save playwright@1.65.1
          npx playwright install --with-deps chromium
          node site/e2e/playground.e2e.mjs
      - run: node --check site/app.mjs
