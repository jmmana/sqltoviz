name: Playground CI
on:
  pull_request:
    paths: ['site/**','.github/workflows/site-ci.yml']
  push:
    branches: [development,main]
    paths: ['site/**','.github/workflows/site-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test site/*.test.mjs
      - run: node --check site/app.mjs
