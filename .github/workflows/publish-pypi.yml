name: Publish Python alpha
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to production PyPI (irreversible version)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m unittest discover -s tests
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python -m venv /tmp/sqltoviz-smoke
          /tmp/sqltoviz-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/sqltoviz-smoke/bin/python -c "from sqltoviz import recommend; assert recommend('SELECT 1',[{'x':1}])['chartType']=='kpi'"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: packages/python/dist/
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
