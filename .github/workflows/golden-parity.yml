name: Cross-language parity gate
# Release gate (#82): the 308 golden cases (features, rejections, ONNX scores, classes, roles) plus 3000 differential fuzz cases generated from the
# Python SDK must pass unchanged in Python, TypeScript (Node + WASM) and .NET 8/10, and the generated bindings must match the frozen spec.
on:
  pull_request:   # no path filter: `gate` is a required check on main, so it must report on every PR
  push:
    branches: [development, main]
    paths: ['parity/**', 'spec/**', 'model/**', 'packages/**', '.github/workflows/golden-parity.yml']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generated bindings match the frozen spec
        run: python spec/generate_bindings.py --check
      - name: Contract hashes (base + additive outputs extension)
        run: python spec/verify_contract.py
      - name: Outputs fixtures are current (expected values from the Python reference)
        run: python parity/tools/gen_outputs.py --check
      - name: Golden file is pinned to the frozen contract
        run: |
          python - <<'EOF'
          import hashlib, json
          sha = hashlib.sha256(open('spec/sqlvizspec-v1-features.json', 'rb').read()).hexdigest()
          g = json.load(open('parity/golden_v1.json'))
          assert g['contract_sha256'] == sha, 'golden file built with another contract'
          assert g['n_cases'] >= 288 and g['n_cases'] == len(g['cases'])
          print('golden cases:', g['n_cases'], 'contract', sha[:12])
          EOF
      - name: Generate differential fuzz cases (expected values from the Python SDK)
        run: python parity/tools/gen_fuzz.py fuzz.json 3000
      - name: Generate numerical-faithfulness cases (exact rational/decimal references)
        run: python parity/tools/gen_faithfulness.py faith.json 1500
      - uses: actions/upload-artifact@v7
        with:
          name: parity-fuzz
          path: |
            fuzz.json
            faith.json
  python:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: parity-fuzz
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy onnxruntime
      - run: cd packages/python && SQLTOVIZ_FAITH="$GITHUB_WORKSPACE/faith.json" python -m unittest discover -s tests
      - name: Outputs v1 parity (parity/outputs_v1.json, SqlVizSpec-Outputs-v1.0.0)
        run: cd packages/python && python -m unittest tests.test_outputs -v
  node:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: parity-fuzz
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cd packages/npm && npm install --ignore-scripts && SQLTOVIZ_FUZZ="$GITHUB_WORKSPACE/fuzz.json" SQLTOVIZ_FAITH="$GITHUB_WORKSPACE/faith.json" npm test
      # TODO phase 2 (#40/#44/#108): replay parity/outputs_v1.json against the TypeScript port (generated constants: packages/npm/src/outputs-contract.ts)
  dotnet:
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tfm: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: parity-fuzz
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: SQLTOVIZ_FUZZ="$GITHUB_WORKSPACE/fuzz.json" SQLTOVIZ_FAITH="$GITHUB_WORKSPACE/faith.json" dotnet test packages/nuget/SqlToViz.Tests/SqlToViz.Tests.csproj -c Release -f ${{ matrix.tfm }}
      # TODO phase 2 (#40/#44/#108): replay parity/outputs_v1.json against the .NET port (generated constants: packages/nuget/SqlToViz/OutputsContract.cs)
  gate:
    needs: [python, node, dotnet]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Python, TypeScript and .NET agree with the golden fixtures and the Python-generated fuzz cases."
