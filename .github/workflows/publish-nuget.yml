name: Publish NuGet alpha
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish production NuGet package'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test packages/nuget/SqlToViz.Tests/SqlToViz.Tests.csproj -c Release
      - run: dotnet pack packages/nuget/SqlToViz/SqlToViz.csproj -c Release -o artifacts
      - run: dotnet pack packages/nuget/SqlToViz.Onnx/SqlToViz.Onnx.csproj -c Release -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-distribution
          path: artifacts/*.nupkg
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-distribution
          path: artifacts
      - name: Validate username configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: test -n "$NUGET_USER"
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'artifacts/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
