name: Pages preview
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'packages/npm/**', 'model/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cd packages/npm && npm install --ignore-scripts && npm run build
      - run: node site/build-engine.mjs
      - run: node --test site/*.test.mjs
      - run: npm ci --ignore-scripts && npm run build
        working-directory: docs
      - run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R docs/assets _site/assets
          cp -R docs/.vitepress/dist _site/docs
      - id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
